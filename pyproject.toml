[project]
name = "lakehouse-mcp"
version = "0.1.0"
description = "An MCP server that lets AI agents inspect and query a Delta lakehouse, read-only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
    "deltalake>=0.21",
    "duckdb>=1.1",
    "pyarrow>=17",
    # DuckDB needs it to hand back timestamp-with-timezone columns, which any
    # real lakehouse table has. Without it, a SELECT touching a timestamp fails
    # at fetch time with a bare ModuleNotFoundError.
    "pytz>=2024.1",
]

[project.scripts]
lakehouse-mcp = "lakehouse_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
